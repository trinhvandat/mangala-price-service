# =============================================================================
# mangala-price-service - Nginx Configuration
# =============================================================================
# Place this file in /etc/nginx/sites-available/price-service.conf
# Then: ln -s /etc/nginx/sites-available/price-service.conf /etc/nginx/sites-enabled/
# =============================================================================

upstream price_service {
    server 127.0.0.1:8080;
    keepalive 32;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name price-staging.mangala.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name price-staging.mangala.dev;

    # SSL certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/price-staging.mangala.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/price-staging.mangala.dev/privkey.pem;

    # SSL configuration
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Modern TLS configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000" always;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging
    access_log /var/log/nginx/price-service.access.log;
    error_log /var/log/nginx/price-service.error.log;

    # Proxy settings
    location / {
        proxy_pass http://price_service;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (if needed later)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint (no auth, for monitoring)
    location /actuator/health {
        proxy_pass http://price_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Allow health checks without rate limiting
        limit_req off;
    }

    # Metrics endpoint (restrict to internal IPs in production)
    location /actuator/metrics {
        proxy_pass http://price_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # In production, restrict to monitoring IPs
        # allow 10.0.0.0/8;
        # deny all;
    }
}
